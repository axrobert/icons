name: Validate AXR Icons collection
on:
  pull_request:
  push:
    branches: [main, feat/mascot-icon-system-v1]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset checks
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate all 126 image entries
        run: python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test stack slug mapping
        run: node scripts/test_resolver.mjs
