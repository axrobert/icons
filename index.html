<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXR Icons — Stack Mascots</title><link rel="stylesheet" href="style.css"><main><div class="eyebrow">AXROBERT / ICON SYSTEM V1</div><h1>Icons with personality.</h1><p>Technology-inspired mascot icon prototypes. A coherent family of custom SVG tiles for stack displays. These are the starting shapes, not the final illustration set.</p><div class="toolbar"><input id="search" placeholder="Search stacks..." aria-label="Search stacks"><select id="category" aria-label="Category"><option value="">All stacks</option><option value="database">Databases</option><option value="framework">Frameworks</option><option value="platform">Platforms</option><option value="technology">Other technologies</option></select><small id="count"></small></div><div class="grid" id="grid"></div><p>Source & guidelines: <a href="https://github.com/axrobert/icons">GitHub repository</a></p></main><script type="module">const data=await(await fetch('./registry.json')).json();const grid=document.querySelector('#grid'),input=document.querySelector('#search'),category=document.querySelector('#category'),count=document.querySelector('#count');function draw(){const filtered=data.filter(i=>(i.slug+' '+i.name).toLowerCase().includes(input.value.toLowerCase())&&(!category.value||category.value===i.category));grid.replaceChildren(...filtered.map(i=>{const a=document.createElement('a');a.className='tile';a.href=i.file;a.download=i.slug+'.svg';const image=document.createElement('img');image.src=i.file;image.alt=i.name+' mascot icon';image.loading='lazy';const span=document.createElement('span');span.textContent=i.name;a.append(image,span);return a}));count.textContent=filtered.length+' icons'}input.addEventListener('input',draw);category.addEventListener('change',draw);draw();</script></html>
